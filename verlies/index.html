<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Verlies">
<meta name="theme-color" content="#1C1A33">
<title>Verlies zu dritt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Inter:wght@400;500;600;700&family=Alegreya:ital,wght@0,500;0,700;1,500&display=swap">
<style>
/* Gleiche Familie wie die anderen Spiele (Tintenblau, Korall), dazu Pergament-Buchseiten mit Tuschezeichnungen */
:root{
  --bg:#1C1A33; --flaeche:#272447; --flaeche2:#322E5A; --text:#F3F0FF; --leise:#A8A2CC; --linie:#3D3868;
  --akzent:#FF6B57; --akzent-text:#1C1A33; --karte-gelb:#FFD447; --gut:#5BD69A; --herz:#FF7FB0;
  --pergament:#F3E6CC; --pergament2:#E8D6B3; --tinte:#2A2118; --roetel:#9E2B1F;
  --display:"Unbounded","Segoe UI",system-ui,sans-serif; --fliess:"Inter","Segoe UI",system-ui,sans-serif; --buch:"Alegreya",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--fliess);-webkit-text-size-adjust:100%}
body{padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:1.9rem;line-height:1.1;font-weight:800}
h2{font-size:1.05rem;font-weight:600;line-height:1.3}
h3{font-size:.95rem;font-weight:600}
.titel{display:flex;flex-direction:column;gap:6px;padding-top:8px}
.leise{color:var(--leise);margin:0}
.klein{font-size:.85rem}
.mitte{text-align:center}
.etikett{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--leise);font-weight:600;margin:0}
.karte{background:var(--flaeche);border:1px solid var(--linie);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.feld{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--leise);font-weight:500}
.feld input{font:500 1.05rem var(--fliess);color:var(--text);background:var(--flaeche2);border:1px solid var(--linie);border-radius:12px;padding:13px 14px;width:100%;outline:none}
.feld input:focus{border-color:var(--akzent)}
.knopf{appearance:none;border:0;border-radius:14px;padding:15px 18px;font:700 1rem var(--fliess);background:var(--akzent);color:var(--akzent-text);width:100%;cursor:pointer}
.knopf.zweit{background:transparent;color:var(--text);border:1px solid var(--linie)}
.knopf:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--karte-gelb);outline-offset:2px}
.reihe{display:flex;gap:10px}
.link{background:none;border:0;color:var(--leise);text-decoration:underline;font:inherit;cursor:pointer;padding:8px;align-self:center}
.code{font-family:var(--display);font-weight:800;font-size:3.4rem;letter-spacing:.12em;line-height:1}
.qr{background:#fff;border-radius:16px;padding:10px;width:200px;max-width:60%;align-self:center}
.qr svg{display:block;width:100%;height:auto}
.spieler{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.spieler li{display:flex;align-items:center;gap:10px;font-weight:600}
.spieler small{color:var(--leise);font-weight:500}
.punkt{width:10px;height:10px;border-radius:50%;background:var(--linie);display:inline-block;flex:none}
.punkt.an{background:var(--gut)}
.status{position:sticky;top:0;z-index:5;background:var(--karte-gelb);color:var(--bg);border-radius:12px;padding:10px 12px;font-weight:600;font-size:.9rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.status button{appearance:none;border:0;background:var(--bg);color:var(--text);border-radius:999px;padding:8px 14px;font:600 .9rem var(--fliess);cursor:pointer}

/* Rollenwahl */
.rollen{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rolle{appearance:none;text-align:left;display:flex;flex-direction:column;gap:4px;background:var(--flaeche2);border:2px solid var(--linie);border-radius:16px;padding:10px;color:var(--text);font:inherit;cursor:pointer}
.rolle .heldbild{width:52px;height:46px;background:var(--pergament);border-radius:10px;padding:4px}
.rolle b{font-family:var(--display);font-size:.92rem}
.rolle small{color:var(--leise);font-size:.82rem;line-height:1.35}
.rolle .wer{font-weight:600;font-size:.85rem}
.rolle.meins{border-color:var(--karte-gelb);background:#3A355F}
.rolle.belegt{opacity:.55;cursor:default}

/* Kopfzeile im Spiel */
.kopf{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fortschritt{display:flex;gap:5px}
.fortschritt i{width:14px;height:14px;border-radius:4px;background:var(--flaeche2);border:1px solid var(--linie)}
.fortschritt i.da{background:var(--leise)}
.fortschritt i.hier{background:var(--karte-gelb);border-color:var(--karte-gelb)}
.fortschritt i.boss{border-radius:50%;border-color:var(--akzent)}
.gold{font-family:var(--display);font-weight:600;color:var(--karte-gelb);white-space:nowrap}

/* Buchseite */
.seite{background:var(--pergament);color:var(--tinte);border-radius:6px 18px 18px 6px;padding:16px 18px 18px;box-shadow:inset 6px 0 0 var(--pergament2),0 6px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;gap:8px;font:1.06rem/1.5 var(--buch)}
.seite svg.bild{width:100%;height:auto;max-height:170px;display:block}
.seite h2{font-family:var(--buch);font-weight:700;font-size:1.35rem;color:var(--tinte)}
.seite p{margin:0}
.seite p.erg{font-style:italic}
.seite .rot{color:var(--roetel)}
.chronik{background:var(--pergament);color:var(--tinte);border-radius:14px;padding:12px 14px;font:.98rem/1.45 var(--buch);display:flex;flex-direction:column;gap:3px}
.chronik p{margin:0}
.chronik .etikett{color:#7A6A55}

/* Abstimmung */
.optionen{display:flex;flex-direction:column;gap:10px}
.option{appearance:none;text-align:left;background:var(--flaeche2);border:2px solid var(--linie);border-radius:16px;padding:14px 16px;color:var(--text);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.option b{font-size:1.05rem}
.option i{color:var(--leise);font-family:var(--buch);font-size:1.02rem}
.option .stimmen{font-size:.82rem;color:var(--karte-gelb);font-weight:600;min-height:1em}
.option.meins{border-color:var(--karte-gelb)}

/* Kampf */
.reihe-k{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.figur{appearance:none;text-align:left;background:var(--flaeche);border:2px solid var(--linie);border-radius:16px;padding:10px;color:var(--text);font:inherit;display:flex;flex-direction:column;gap:6px;position:relative}
.figur .kbild{width:100%;height:66px;background:var(--pergament);border-radius:10px}
.figur .heldbild{width:44px;height:40px;background:var(--pergament);border-radius:10px;padding:3px;flex:none}
.figur .zeile{display:flex;align-items:center;gap:8px}
.figur b{font-size:.92rem;line-height:1.2}
.figur small{color:var(--leise);font-size:.78rem}
.balken{height:10px;border-radius:99px;background:#15132A;overflow:hidden;border:1px solid var(--linie)}
.balken i{display:block;height:100%;background:var(--gut);border-radius:99px}
.balken.mittel i{background:var(--karte-gelb)}
.balken.knapp i{background:var(--akzent)}
.figur .zahl{font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--leise)}
.figur.ziel{border-color:var(--karte-gelb);cursor:pointer;box-shadow:0 0 0 3px rgba(255,212,71,.25)}
.figur.weg{opacity:.4}
.marken{display:flex;flex-wrap:wrap;gap:4px}
.marke{font-size:.72rem;font-weight:700;border-radius:99px;padding:2px 8px;background:var(--flaeche2);color:var(--text)}
.marke.gift{background:#2E5A3E}
.marke.schild{background:#6B3A2E}
.marke.schatten{background:#4A3F8A}
.marke.ok{background:var(--gut);color:var(--bg)}
.aktionen{display:grid;grid-template-columns:1fr;gap:8px}
.aktion{appearance:none;text-align:left;background:var(--flaeche2);border:2px solid var(--linie);border-radius:14px;padding:12px 14px;color:var(--text);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.aktion b{font-size:1rem}
.aktion small{color:var(--leise);font-size:.82rem}
.aktion.an{border-color:var(--karte-gelb);background:#3A355F}
.aktion:disabled{opacity:.4;cursor:default}
.hinweis{background:var(--karte-gelb);color:var(--bg);border-radius:12px;padding:10px 12px;font-weight:600;font-size:.92rem}
.unten{position:sticky;bottom:0;padding-block:12px calc(4px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);display:flex;flex-direction:column;gap:8px;z-index:3}

/* Heldenzeilen */
.heldenliste{display:flex;flex-direction:column;gap:8px}
.heldzeile{appearance:none;display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:var(--flaeche);border:2px solid var(--linie);border-radius:14px;padding:8px 12px 8px 8px;color:var(--text);font:inherit;text-align:left}
.heldzeile .heldbild{width:40px;height:36px;background:var(--pergament);border-radius:9px;padding:3px}
.heldzeile .mitte-sp{display:flex;flex-direction:column;gap:4px;min-width:0}
.heldzeile .kopfzeile{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.heldzeile b{font-size:.95rem}
.heldzeile small{color:var(--leise);font-size:.78rem}
.heldzeile .hp{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;font-size:1.05rem}
.heldzeile .hp small{font-family:var(--fliess);font-weight:500}
.heldzeile.ziel{border-color:var(--karte-gelb);cursor:pointer;box-shadow:0 0 0 3px rgba(255,212,71,.25)}
.heldzeile.weg{opacity:.45}

/* Händlerlager */
.waren{display:flex;flex-direction:column;gap:8px}
.ware{appearance:none;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;text-align:left;background:var(--flaeche2);border:2px solid var(--linie);border-radius:14px;padding:12px 14px;color:var(--text);font:inherit;cursor:pointer}
.ware b{font-size:.98rem}
.ware small{color:var(--leise);font-size:.82rem;grid-column:1}
.ware .preis{grid-row:span 2;grid-column:2;font-family:var(--display);font-weight:600;color:var(--karte-gelb);white-space:nowrap}
.ware.faehigkeit{border-color:#5B4A9E}
.ware:disabled{opacity:.4;cursor:default}
.ware.aus .preis{color:var(--gut)}
.ausruestung{display:flex;flex-wrap:wrap;gap:6px}
.kaeufe{font-size:.85rem;color:var(--leise);margin:0}

/* Ende */
.werte{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.werte th,.werte td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--linie);font-size:.9rem}
.werte th:first-child,.werte td:first-child{text-align:left}
.werte th{color:var(--leise);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"><p class="leise">Lädt …</p></main>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="bilder.js"></script>
<script src="verlies-logic.js"></script>
<script src="verlies.js"></script>
</body>
</html>

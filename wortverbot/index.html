<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wortverbot">
<meta name="theme-color" content="#132A31">
<title>Wortverbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#132A31; --flaeche:#1C3A43; --flaeche2:#244852; --text:#F1F7F5; --leise:#9DBAB8; --linie:#2F5A64;
  --akzent:#FFC94A; --akzent-text:#132A31; --karte-gelb:#FFC94A; --gut:#5BD69A; --rot:#FF5A5F; --t0:#FF8A3D; --t1:#7FB2FF;
  --display:"Unbounded","Segoe UI",system-ui,sans-serif; --fliess:"Inter","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--fliess);-webkit-text-size-adjust:100%}
body{padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:1.9rem;line-height:1.1;font-weight:800}
h2{font-size:1.05rem;font-weight:600;line-height:1.3}
.titel{display:flex;flex-direction:column;gap:6px;padding-top:8px}
.titelbild{display:block;width:100%;max-width:420px;height:auto;margin:0 auto 8px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
.leise{color:var(--leise);margin:0}
.klein{font-size:.85rem}
.mitte{text-align:center}
.etikett{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--leise);font-weight:600;margin:0}
.karte{background:var(--flaeche);border:1px solid var(--linie);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.feld{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--leise);font-weight:500}
.feld input,input.gross{font:500 1.05rem var(--fliess);color:var(--text);background:var(--flaeche2);border:1px solid var(--linie);border-radius:12px;padding:13px 14px;width:100%;outline:none}
.feld input:focus,input.gross:focus{border-color:var(--akzent)}
.knopf{appearance:none;border:0;border-radius:14px;padding:15px 18px;font:700 1rem var(--fliess);background:var(--akzent);color:var(--akzent-text);width:100%;cursor:pointer}
.knopf.zweit{background:transparent;color:var(--text);border:1px solid var(--linie)}
.knopf:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--karte-gelb);outline-offset:2px}
.reihe{display:flex;gap:10px}
.unten.reihe{flex-direction:row}
.wahl{display:flex;gap:8px}
.wahl button,button.klein{appearance:none;border:1px solid var(--linie);background:var(--flaeche2);color:var(--text);border-radius:999px;padding:8px 14px;font:600 .9rem var(--fliess);cursor:pointer}
.wahl button{flex:1}
.wahl button.an,button.klein.an{background:var(--text);color:var(--bg);border-color:var(--text)}
.link{background:none;border:0;color:var(--leise);text-decoration:underline;font:inherit;cursor:pointer;padding:8px;align-self:center}
.code{font-family:var(--display);font-weight:800;font-size:3.4rem;letter-spacing:.12em;line-height:1}
.qr{background:#fff;border-radius:16px;padding:10px;width:200px;max-width:60%;align-self:center}
.qr svg{display:block;width:100%;height:auto}
.spieler{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.spieler li{display:flex;align-items:center;gap:10px;font-weight:600}
.spieler small{color:var(--leise);font-weight:500}
.punkt{width:10px;height:10px;border-radius:50%;background:var(--linie);display:inline-block}
.punkt.an{background:var(--gut)}
.status{position:sticky;top:0;z-index:5;background:var(--karte-gelb);color:var(--bg);border-radius:12px;padding:10px 12px;font-weight:600;font-size:.9rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.status button.klein{background:var(--bg);color:var(--text);border-color:var(--bg)}
.spielkopf{display:flex;align-items:center;justify-content:space-between;gap:16px}
.zeit{font-family:var(--display);font-size:1.8rem;font-weight:600;font-variant-numeric:tabular-nums}
.zeit.knapp{color:var(--akzent)}
.zitat{font-family:var(--display);font-weight:600;font-size:1.2rem;line-height:1.35;margin:0}
.malbox,.bildbox{width:100%;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.malbox canvas,.bildbox canvas{display:block;max-width:100%}
.werkzeug{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.farbe{width:36px;height:36px;border-radius:50%;border:2px solid var(--linie);cursor:pointer;font:700 1rem var(--fliess);color:#16161D}
.farbe.an{outline:3px solid var(--karte-gelb);outline-offset:2px}
.malbox{position:relative}
.unten{position:sticky;bottom:0;padding-block:12px calc(4px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);display:flex;flex-direction:column;gap:8px;z-index:3}
.rang{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rang li{display:flex;align-items:center;gap:12px;background:var(--flaeche);border:1px solid var(--linie);border-radius:14px;padding:12px 14px;font-variant-numeric:tabular-nums}
.rang .platz{font-family:var(--display);font-weight:800;width:1.5em;color:var(--leise)}
.rang li:first-child .platz{color:var(--karte-gelb)}
.rang .n{flex:1;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);font-weight:600;padding:10px 16px;border-radius:12px;z-index:20;max-width:90vw;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.toast.gut{background:var(--gut)}
.regeln{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--leise);font-size:.92rem}
.regeln b{color:var(--text)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.malbox canvas{touch-action:none;cursor:crosshair}
.knopf.gut{background:var(--gut);color:var(--bg)}
.knopf.erwischt{background:var(--rot);color:#fff;font:800 1.6rem var(--display);padding:26px 18px;border-radius:20px;box-shadow:0 6px 0 #9E2B30}
.knopf.erwischt:active{transform:translateY(4px);box-shadow:0 2px 0 #9E2B30}
.knopf.gross{font-size:1.15rem;padding:18px}
.unten .reihe .knopf{flex:1;font-size:1.1rem;padding:18px 12px}
.stand{display:flex;gap:8px}
.teamstand{flex:1;display:flex;justify-content:space-between;align-items:center;background:var(--flaeche);border:2px solid var(--linie);border-radius:14px;padding:8px 12px;font-weight:600}
.teamstand b{font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.teamstand.t0 b{color:var(--t0)} .teamstand.t1 b{color:var(--t1)}
.teamstand.dran.t0{border-color:var(--t0)} .teamstand.dran.t1{border-color:var(--t1)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.team h2{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.team h2 small{color:var(--leise);font:600 .85rem var(--fliess)}
.team ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.team.t0 h2{color:var(--t0)} .team.t1 h2{color:var(--t1)}
.person{appearance:none;width:100%;text-align:left;border:1px solid var(--linie);background:var(--flaeche2);color:var(--text);border-radius:10px;padding:9px 10px;font:600 .95rem var(--fliess);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team.t0 .person{border-left:4px solid var(--t0)} .team.t1 .person{border-left:4px solid var(--t1)}
.person small{color:var(--leise);font-weight:500}
.person:disabled{cursor:default;opacity:1}
.person.weg{opacity:.45}
.bereitkarte{text-align:center;align-items:center;padding:24px 16px}
.bereitkarte.t0{border-color:var(--t0)} .bereitkarte.t1{border-color:var(--t1)}
.bereitkarte p{margin:0}
.ratekarte{text-align:center;padding:30px 16px}
.ratekarte.t0{border-color:var(--t0)} .ratekarte.t1{border-color:var(--t1)}
.ratekarte p{margin:0}.ratekarte .gross{font-family:var(--display);font-weight:800;font-size:1.5rem}
.spielkarte{background:#FFFBEF;color:#132A31;border-radius:18px;padding:18px 16px;box-shadow:0 6px 0 rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;gap:10px}
.begriff{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1.1;margin:0;text-align:center;overflow-wrap:anywhere}
.tabu{list-style:none;margin:0;padding:12px 0 0;border-top:2px dashed #E7D9B4;width:100%;display:flex;flex-direction:column;align-items:center;gap:4px}
.tabu li{color:#C6362F;font-weight:700;font-size:1.2rem}
.verbot{margin:0;color:#C6362F;font-weight:700}
.kartenliste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.kartenliste li{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.kartenliste li b{font-weight:600;font-size:.85rem;color:var(--leise);white-space:nowrap}
.kartenliste li.richtig b{color:var(--gut)} .kartenliste li.erwischt b{color:var(--rot)}
.kartenliste li.weiter span{color:var(--leise)}
.korr{appearance:none;display:flex;justify-content:space-between;gap:10px;align-items:baseline;width:100%;background:var(--flaeche2);border:1px solid var(--linie);color:var(--text);border-radius:10px;padding:8px 10px;font:500 1rem var(--fliess);cursor:pointer;text-align:left}

</style>
</head>
<body>
<main id="app" aria-live="polite"><p class="leise">Lädt …</p></main>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="../netz.js"></script>
<script src="../abend.js?v=2026-11-17e" data-spiel="wortverbot"></script>
<script src="logic.js?v=2026-11-17e"></script>
<script src="app.js?v=2026-11-17e"></script>
</body>
</html>

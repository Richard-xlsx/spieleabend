<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tapetenwechsel: Zimmer-Test</title>
<style>
  html, body { margin: 0; height: 100%; background: #222; overflow: hidden; font: 14px system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #info { position: fixed; left: 8px; top: 8px; color: #fff; background: #0008; padding: 6px 10px; border-radius: 8px; }
  #farbe { display: inline-block; width: 16px; height: 16px; vertical-align: middle; border: 1px solid #fff; margin-left: 6px; }
</style>
</head>
<body>
<div id="info"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// Testseite für zimmer.js: ?zimmer=wohnzimmer|kinderzimmer|kueche &seed=1 &blick=0..4 (fester Blickpunkt, sonst langsame Runde aus der Mitte)
import * as THREE from "three";
import { ZIMMER, baue, licht } from "../zimmer.js";

const q = new URLSearchParams(location.search);
const art = q.get("zimmer") || "wohnzimmer", seed = +(q.get("seed") || 1);
let blick = q.has("blick") ? +q.get("blick") : -1;
const renderer = new THREE.WebGLRenderer({ antialias: q.get("aa") !== "0", preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const szene = new THREE.Scene();
licht(szene);
const t0 = performance.now();
const z = baue(art, seed);
const bauzeit = performance.now() - t0;
szene.add(z.gruppe);
const kamera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, .05, 30);
const mitte = new THREE.Vector3((z.raum.x0 + z.raum.x1) / 2, 1.6, (z.raum.z0 + z.raum.z1) / 2);
function stelle(winkel) {
  if (blick >= 0) { const b = z.blickpunkte[blick % z.blickpunkte.length]; kamera.position.copy(b.pos); kamera.lookAt(b.ziel); }
  else { kamera.position.copy(mitte); kamera.lookAt(mitte.x + Math.cos(winkel), 1.1, mitte.z + Math.sin(winkel)); }
}
const info = document.getElementById("info");
let winkel = 0, laeuft = !q.has("stop");
function zeichne() { stelle(winkel); renderer.render(szene, kamera); }
function schleife() { if (laeuft) winkel += .003; zeichne(); requestAnimationFrame(schleife); }
schleife();
const text = () => `${ZIMMER[art].name} · Startwert ${seed} · ${z.meshes.length} Meshes · ${renderer.info.render.calls} Aufrufe · ${bauzeit.toFixed(0)} ms`;
info.textContent = text();

const ray = new THREE.Raycaster();
function treffer(nx, ny) { ray.setFromCamera(new THREE.Vector2(nx, ny), kamera); return ray.intersectObjects(z.meshes, false)[0]; }
addEventListener("click", e => {
  const t = treffer(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  if (!t) return;
  const f = z.farbeAn(t);
  console.log("farbeAn", f, t.object.geometry.type, t.point.toArray().map(v => v.toFixed(2)).join(","));
  info.innerHTML = text() + ` · <b>${f}</b><span id="farbe" style="background:${f}"></span>`;
});

// Für Playwright: Albedo-Prüfung. Alle Stoffe werden durch MeshBasicMaterial (ohne Licht, nächster Bildpunkt) ersetzt,
// dann wird an n Stellen das gerenderte Pixel mit farbeAn verglichen.
function albedoModus(an) {
  for (const m of z.meshes) {
    if (an) {
      m.userData.alt = m.material;
      const conv = mat => { const b = new THREE.MeshBasicMaterial({ color: mat.color, map: mat.map || null, vertexColors: mat.vertexColors, side: mat.side });
        if (mat.map) { mat.map.minFilter = THREE.NearestFilter; mat.map.magFilter = THREE.NearestFilter; mat.map.generateMipmaps = false; mat.map.needsUpdate = true; } return b; };
      m.material = Array.isArray(m.material) ? m.material.map(conv) : conv(m.material);
    } else m.material = m.userData.alt;
  }
}
window.zimmerTest = {
  z, art, seed, kamera, renderer, szene,
  stopp() { laeuft = false; },
  blick(i) { blick = i; laeuft = false; zeichne(); },
  info() { return { meshes: z.meshes.length, calls: renderer.info.render.calls, dreiecke: renderer.info.render.triangles, bauzeit, kaesten: z.kaesten.length, raum: z.raum, blickpunkte: z.blickpunkte.map(b => ({ name: b.name, pos: b.pos.toArray(), ziel: b.ziel.toArray() })) }; },
  kaestenJSON() { return JSON.stringify(z.kaesten); },
  pruefeAlbedo(n = 400) {
    laeuft = false; blick >= 0 || stelle(winkel);
    albedoModus(true); renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight); renderer.render(szene, kamera);
    const gl = renderer.getContext(), W = gl.drawingBufferWidth, H = gl.drawingBufferHeight, px = new Uint8Array(4);
    let gleich = 0, nah = 0, gesamt = 0; const fehler = {}, sorten = {};
    for (let i = 0; i < n; i++) {
      const sx = Math.floor((i * 0.6180339887 % 1) * W), sy = Math.floor(((i * 0.7548776662) % 1) * H);
      const t = treffer((sx + .5) / W * 2 - 1, -((sy + .5) / H) * 2 + 1); if (!t) continue;
      gl.readPixels(sx, H - 1 - sy, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
      const f = z.farbeAn(t), r = parseInt(f.slice(1, 3), 16), g = parseInt(f.slice(3, 5), 16), b = parseInt(f.slice(5, 7), 16);
      const d = Math.max(Math.abs(r - px[0]), Math.abs(g - px[1]), Math.abs(b - px[2]));
      let mat = t.object.material; if (Array.isArray(mat)) mat = mat[t.face.materialIndex];
      const sorte = mat.vertexColors ? "eckfarben" : mat.map ? "muster" : "uni";
      sorten[sorte] = sorten[sorte] || [0, 0]; sorten[sorte][1]++;
      gesamt++; if (d <= 2) { gleich++; sorten[sorte][0]++; } else if (d <= 12) nah++; else fehler[f + " vs " + Array.from(px.slice(0, 3)).map(v => v.toString(16).padStart(2, "0")).join("")] = sorte;
    }
    albedoModus(false); renderer.render(szene, kamera);
    return { gesamt, gleich, nah, sorten, fehler: Object.entries(fehler).slice(0, 12) };
  },
};
</script>
</body>
</html>

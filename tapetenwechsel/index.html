<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tapetenwechsel">
<meta name="theme-color" content="#E9D8B4">
<title>Tapetenwechsel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Tapetenwechsel: Blümchentapete, Holz, Plüsch und knallige Klecksfarben */
:root{
  --bg:#EFE2C4; --flaeche:#FFFBF2; --flaeche2:#F1E4C8; --text:#2B1F1A; --leise:#7A6553; --linie:#D9C4A2;
  --rot:#C8453A; --blau:#2E6FB0; --gruen:#3B8F5A; --gelb:#F3B700; --rosa:#D9738B;
  --display:"Permanent Marker","Marker Felt","Comic Sans MS",cursive; --fliess:"Inter","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;color:var(--text);font:16px/1.45 var(--fliess);-webkit-text-size-adjust:100%}
html{background:var(--bg)}
body{min-height:100vh;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  background:radial-gradient(circle at 10px 10px,#D9738B33 3px,#0000 3.5px) 0 0/40px 40px,radial-gradient(circle at 30px 30px,#7FA36B33 3px,#0000 3.5px) 0 0/40px 40px,var(--bg)}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:400 2rem/1.1 var(--display)}
h2{font-size:1rem;font-weight:800}
h3{font-size:.85rem;font-weight:800;color:var(--leise);margin-top:4px}
.titel{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.titel h1{font-size:2.6rem;color:var(--rot);transform:rotate(-2deg);text-shadow:2px 2px 0 #2B1F1A22}
.titelbild{width:100%;height:auto;border-radius:16px;border:2.5px solid var(--text)}
.tb-klecks{animation:tarnen 4s ease-in-out infinite}
@keyframes tarnen{0%,100%{opacity:.25}50%{opacity:1}}
.etikett{margin:0;font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--leise)}
.leise{color:var(--leise);margin:0}
.mitte{text-align:center;margin:0}
.klein{font-size:.86rem}
.gross{font:400 1.6rem var(--display);margin:0;color:var(--blau)}
.code{font:400 3rem/1 var(--display);letter-spacing:.12em;color:var(--blau)}
.karte-box{background:var(--flaeche);border:2px solid var(--text);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:3px 3px 0 #2B1F1A18}
.einladen{flex-direction:row;align-items:center}
.qr{width:120px;flex:none}.qr svg{width:100%;height:auto;display:block}
.feld{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9rem}
input{font:inherit;padding:12px;border-radius:12px;border:2px solid var(--text);background:#fff;color:var(--text)}
.knopf{appearance:none;font:800 1.05rem var(--fliess);padding:14px 16px;border-radius:14px;border:2.5px solid var(--text);background:var(--rot);color:#fff;cursor:pointer;box-shadow:3px 3px 0 var(--text)}
.knopf:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--text)}
.knopf.zweit{background:var(--flaeche2);color:var(--text)}
.klein-knopf{padding:9px 12px;font-size:.9rem}
.link{appearance:none;background:none;border:0;color:var(--blau);font:600 .95rem var(--fliess);text-decoration:underline;cursor:pointer;padding:8px;text-align:center}
.reihe{display:flex;gap:8px}
.liste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.liste li{display:flex;align-items:center;gap:10px;font-weight:600}
.liste .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.liste small{color:var(--leise);font-weight:500}
.liste .punkte{font:400 1.25rem var(--display)}
.liste .platz{width:1.8em;font:400 1.2rem var(--display);color:var(--leise)}
.mini{appearance:none;border:2px solid var(--linie);background:#fff;border-radius:8px;width:30px;height:30px;cursor:pointer}
.marke{display:inline-grid;place-items:center;width:30px;height:30px;flex:none;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:var(--f);border:2px solid var(--text);font:800 .85rem var(--fliess);color:#fff;text-shadow:0 1px 0 #0006;vertical-align:middle}
.farben{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.farbe{appearance:none;aspect-ratio:1;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;border:2px solid var(--text);background:var(--f);cursor:pointer}
.farbe.an{outline:3px solid var(--text);outline-offset:2px}.farbe:disabled{opacity:.25}
.laengen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wahl{appearance:none;border:2px solid var(--text);background:var(--flaeche2);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;font:inherit;color:var(--text);cursor:pointer;text-align:center}
.wahl.an{background:var(--blau);color:#fff}.wahl small{font-size:.75rem}
.wahl b{font-size:.88rem}
.arten{display:flex;flex-direction:column;gap:6px}
.art{appearance:none;border:2px solid var(--linie);background:#fff;border-radius:12px;padding:8px 10px;display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;color:var(--text);cursor:pointer}
.art.an{border-color:var(--text)}.art small{display:block;color:var(--leise);font-size:.8rem;line-height:1.3}
.art .haken{flex:none;width:22px;height:22px;border:2px solid var(--text);border-radius:50%;display:grid;place-items:center;font-size:.8rem;background:#fff}
.art.an .haken{background:var(--gruen);color:#fff}
.regeln{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.schalter{display:flex;gap:8px;align-items:center;font-weight:600}
.status{background:var(--gelb);border:2px solid var(--text);border-radius:12px;padding:8px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;font-weight:600;position:relative;z-index:20}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:12px;z-index:60;max-width:90vw;font-weight:600}
.tonknopf{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));z-index:40;appearance:none;border:2px solid var(--text);background:var(--flaeche);border-radius:10px;width:38px;height:38px;font-size:1.1rem;cursor:pointer}
@media (min-width:900px){.spalten{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}#app{max-width:900px}}
.spalten{display:flex;flex-direction:column;gap:12px}
@media (min-width:900px){.spalten{display:grid}}

/* ---------- 3D-Runde: ganzer Bildschirm ---------- */
#welt{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:none;touch-action:none;z-index:0}
body.in-runde,body.in-ende{padding:0;overflow:hidden;overscroll-behavior:none}
body.in-runde #welt,body.in-ende #welt{display:block}
body.in-runde #app{max-width:none;position:fixed;inset:0;pointer-events:none}
body.in-runde .tonknopf{top:auto;bottom:max(8px,env(safe-area-inset-bottom));left:50%;right:auto;transform:translateX(-50%);width:32px;height:32px;font-size:.9rem;opacity:.75}
.runde{position:fixed;inset:0;pointer-events:none;user-select:none;-webkit-user-select:none}
.runde button,.runde input,.runde label{pointer-events:auto}
.oben{position:absolute;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));top:max(6px,env(safe-area-inset-top));display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.oben>span:not(:empty){background:#FFFBF2e8;border:2px solid var(--text);border-radius:10px;padding:2px 10px;font-weight:700;font-size:.85rem}
.oben .zimmer{font:400 .95rem var(--display)!important;color:var(--rot)}
.oben .zeit{font-variant-numeric:tabular-nums;min-width:64px;text-align:center}
.oben .knoepfe{background:none!important;border:0!important;padding:0!important}
.oben .klein{appearance:none;border:2px solid var(--text);background:var(--gelb);border-radius:10px;padding:3px 10px;font:700 .85rem var(--fliess);cursor:pointer}
.mitte-gross{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);background:#FFFBF2f2;border:3px solid var(--text);border-radius:18px;padding:12px 22px;text-align:center;font:400 1.9rem/1.15 var(--display);color:var(--rot);box-shadow:4px 4px 0 var(--text);max-width:min(560px,90vw);display:flex;flex-direction:column;gap:4px;animation:rein .3s ease-out}
.mitte-gross small{font:600 .9rem var(--fliess);color:var(--text)}
.mitte-gross .stand{font:600 .95rem var(--fliess);color:var(--text);display:flex;flex-direction:column;gap:6px;min-width:260px}
.stand ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;max-height:52vh;overflow:auto}
.stand li{display:flex;align-items:center;gap:8px}.stand li span{flex:1;text-align:left}
.stand li b{font:400 1.1rem var(--display)}.stand li i{font-style:normal;color:var(--gruen);font-weight:800;width:2.6em;text-align:right}
.stand .marke{width:24px;height:24px;font-size:.7rem}
.stand .tk{margin:0;color:var(--rot)}
.meldungen{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(6px,env(safe-area-inset-top)) + 38px);display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none;width:min(520px,80vw)}
.meldung{background:#FFFBF2ee;border:2px solid var(--text);border-radius:10px;padding:3px 10px;font-weight:600;font-size:.86rem;animation:rein .25s ease-out;text-align:center}
.meldung.wichtig{background:var(--gelb);font-size:.98rem}
@keyframes rein{from{transform:translateY(-10px);opacity:0}}
.herz{position:absolute;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 calc(40px + 60px * var(--st,0)) calc(10px + 30px * var(--st,0)) #E0182Dcc}
.herz.puls{animation:herz .7s ease-out}
@keyframes herz{0%{opacity:0}15%{opacity:calc(.4 + .6 * var(--st,0))}30%{opacity:.15}45%{opacity:calc(.3 + .5 * var(--st,0))}100%{opacity:0}}
.hochkant{display:none}
@media (orientation:portrait) and (max-width:600px){.hochkant{display:block;position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:var(--text);color:#fff;border-radius:10px;padding:4px 12px;font-weight:700;font-size:.85rem;white-space:nowrap}}
.ui{position:absolute;inset:0;pointer-events:none}
.ui button,.ui input,.ui label{pointer-events:auto}
.ui.gesperrt .vs-links,.ui.gesperrt .vs-rechts{opacity:.45;pointer-events:none}
.ui.gesperrt .vs-links *,.ui.gesperrt .vs-rechts *{pointer-events:none}

/* Verstecken */
.vs-links{position:absolute;left:max(6px,env(safe-area-inset-left));top:46px;bottom:8px;width:138px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;scrollbar-width:none}
.vs-modi{display:flex;flex-direction:column;gap:4px}
.vs-modi button,.vs-werk button{appearance:none;border:2px solid var(--text);background:#FFFBF2ee;border-radius:12px;padding:5px 8px;font:700 .82rem var(--fliess);color:var(--text);cursor:pointer;display:flex;align-items:center;gap:6px;pointer-events:auto}
.vs-modi button b{font-size:1.05rem;width:1.3em;text-align:center}
.vs-modi button.an{background:var(--blau);color:#fff}
.vs-werk{display:flex;flex-direction:column;gap:5px;background:#FFFBF2dd;border:2px solid var(--text);border-radius:12px;padding:6px;pointer-events:auto}
.vs-werk p{margin:0;font-size:.74rem;line-height:1.25;color:var(--leise)}
.vs-werk .reihe{gap:4px}.vs-werk .reihe button{flex:1;justify-content:center}
.vs-werk button.an{background:var(--gelb)}
.vs-werk label{display:flex;flex-direction:column;font:700 .78rem var(--fliess);gap:0}
.vs-werk input[type=range]{width:100%;padding:0;margin:4px 0 0;accent-color:var(--rot);height:26px}
.vs-werk small{display:flex;justify-content:space-between;font-size:.66rem;color:var(--leise);font-weight:600}
.pinsel i{display:block;width:var(--d);height:var(--d);border-radius:50%;background:var(--text)}
.vs-rechts{position:absolute;right:max(6px,env(safe-area-inset-right));top:46px;bottom:56px;width:104px;display:flex;flex-direction:column;gap:6px;align-items:stretch;pointer-events:auto}
.vs-jetzt{height:40px;border:2.5px solid var(--text);border-radius:12px;box-shadow:inset 0 0 0 3px #fff}
.vs-leiste,.vs-kasten{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.vs-leiste:empty::before{content:"Pipette-Farben";grid-column:1/-1;font-size:.66rem;color:var(--text);background:#FFFBF2cc;border-radius:6px;padding:2px 4px;text-align:center}
.vs-leiste button,.vs-kasten button{appearance:none;aspect-ratio:1;border:2px solid var(--text);border-radius:7px;background:var(--c);cursor:pointer;padding:0;min-height:22px}
.vs-kasten{background:#FFFBF2cc;border:2px solid var(--text);border-radius:10px;padding:4px}
.vs-unten{position:absolute;right:max(6px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:6px}
.vs-unten button{appearance:none;border:2.5px solid var(--text);border-radius:12px;padding:6px 12px;font:800 .9rem var(--fliess);cursor:pointer;background:#FFFBF2;color:var(--text);box-shadow:2px 2px 0 var(--text)}
.vs-unten .vs-fertig{background:var(--gruen);color:#fff}
.ui.gesperrt .vs-unten{display:none}
.vs-tipp{position:absolute;left:50%;bottom:60px;transform:translateX(-50%);background:var(--text);color:#fff;border-radius:10px;padding:5px 12px;font-weight:600;font-size:.86rem;opacity:0;transition:opacity .2s;pointer-events:none;max-width:60vw;text-align:center}
.vs-tipp.an{opacity:1}
@media (max-height:420px){.vs-links{width:124px;top:40px}.vs-modi button,.vs-werk button{padding:3px 6px;font-size:.76rem}.vs-rechts{top:40px;width:92px}.vs-jetzt{height:30px}}

/* Suchen */
.ss-kreuz{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid #fffa;border-radius:50%;box-shadow:0 0 0 1px #0005}
.ss-stick{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:#FFFBF255;border:2.5px solid #2B1F1A88;pointer-events:auto;touch-action:none}
.ss-knopf{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#FFFBF2;border:2.5px solid var(--text);box-shadow:2px 2px 0 var(--text)}
.ss-hocke{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));appearance:none;border:2.5px solid var(--text);border-radius:16px;background:#FFFBF2ee;padding:6px 12px;font:800 .85rem var(--fliess);display:flex;flex-direction:column;align-items:center;cursor:pointer;color:var(--text)}
.ss-hocke b,.ss-hocke{font-size:1.2rem}.ss-hocke span{font-size:.72rem}
.ss-hocke.an{background:var(--gelb)}
.ui.zuschauer .ss-stick,.ui.zuschauer .ss-hocke,.ui.zuschauer .ss-kreuz{display:none}
.ss-nebel{position:absolute;inset:0;background:radial-gradient(circle,#fff0 30%,#fffc 75%);opacity:0;transition:opacity .25s;pointer-events:none}
.ss-nebel.an{opacity:1}
.ss-finger{position:absolute;transform:translate(-50%,-110%);font-size:1.8rem;pointer-events:none;animation:finger .9s ease-out forwards;text-shadow:0 2px 0 #fff}
.ss-finger.treffer{font:400 2.4rem var(--display);color:var(--rot)}
@keyframes finger{0%{opacity:0;transform:translate(-50%,-80%) scale(.6)}20%{opacity:1;transform:translate(-50%,-110%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-150%)}}

/* Auflösung */
.af-schild{position:absolute;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;transition:all .35s;background:#FFFBF2;border:3px solid var(--text);border-radius:16px;padding:8px 18px;display:flex;flex-direction:column;align-items:center;box-shadow:4px 4px 0 var(--text);min-width:220px}
.af-schild.an{opacity:1;transform:translate(-50%,0)}
.af-schild b{font:400 1.6rem var(--display);color:var(--f)}
.af-schild span{font-weight:700}

/* Ende */
body.in-ende #app{max-width:none;position:fixed;inset:0;pointer-events:none;padding:0}
.ende{position:fixed;inset:0;display:grid;grid-template-columns:1fr minmax(300px,440px);pointer-events:none}
.ausstellung-rahmen{padding:max(10px,env(safe-area-inset-top)) 14px}
.ausstellung-rahmen .etikett{display:inline-block;background:#FFFBF2e8;border:2px solid var(--text);border-radius:8px;padding:2px 8px;color:var(--text)}
.ende-text{pointer-events:auto;overflow-y:auto;background:#EFE2C4f0;border-left:2.5px solid var(--text);padding:max(12px,env(safe-area-inset-top)) 16px 24px;display:flex;flex-direction:column;gap:10px}
@media (orientation:portrait){.ende{grid-template-columns:1fr;grid-template-rows:38vh 1fr}.ende-text{border-left:0;border-top:2.5px solid var(--text)}}
.podest{display:flex;align-items:flex-end;justify-content:center;gap:6px}
.stufe{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:4px}
.stufe .block{width:100%;background:var(--rosa);border:2.5px solid var(--text);border-radius:8px 8px 0 0;display:grid;place-items:center;font:400 1.6rem var(--display);color:#fff;animation:hoch .8s ease-out both}
.s1 .block{height:100px;animation-delay:.6s;background:var(--gelb)}.s2 .block{height:70px;animation-delay:.3s}.s3 .block{height:50px}
@keyframes hoch{from{transform:scaleY(0);transform-origin:bottom}}
.sieger{display:flex;flex-direction:column;align-items:center;text-align:center;animation:rein .4s 1.2s both}
.sieger small{color:var(--leise)}
.titelliste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.titelliste li{display:grid;grid-template-columns:auto 1fr;gap:0 10px}
.titelliste b{font:400 1.05rem var(--display);color:var(--rot)}
.titelliste small{grid-column:1/-1;color:var(--leise)}
@media (prefers-reduced-motion:reduce){.tb-klecks,.stufe .block,.sieger,.herz.puls{animation:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>

<script src="../netz.js?v=2026-11-27c"></script>
<script src="../abend.js?v=2026-11-27c" data-spiel="tapetenwechsel"></script>
<script src="klang.js?v=2026-11-27c"></script>
<script src="logic.js?v=2026-11-27c"></script>

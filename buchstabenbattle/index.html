<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Glatt, Strand, Nuss">
<meta name="theme-color" content="#FFF3DC">
<title>Glatt, Strand, Nuss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Glatt, Strand, Nuss: hell und frech wie ein Späti. Creme, Flaschengrün, Haselnuss, Eisblau; der Buchstabe sitzt auf einem Kronkorken */
:root{
  --bg:#FFF3DC; --flaeche:#FFFFFF; --flaeche2:#FFF8EC; --text:#2A1A12; --leise:#7A6455; --linie:#E6D2B4;
  --akzent:#E8692E; --akzent-text:#FFFFFF; --karte-gelb:#FFD447; --gut:#2F8F5B; --schlecht:#D2452F;
  --eis:#2B8FC2; --flasche:#2F8F5B; --nuss:#9A5A26; --schatten:#2A1A12; --kuli:#2B4FA8; --karo:#C9DCEE;
  --hand:"Caveat","Segoe Print",cursive;
  --display:"Unbounded","Segoe UI",system-ui,sans-serif; --fliess:"Inter","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--fliess);-webkit-text-size-adjust:100%}
body{padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:2rem;line-height:1.1;font-weight:800}
h2{font-size:1.05rem;font-weight:600}
.titel{display:flex;flex-direction:column;gap:6px;padding-top:8px}
.titelbild{display:block;width:100%;max-width:420px;height:auto;margin:0 auto 8px;filter:drop-shadow(0 5px 0 var(--schatten))}
.leise{color:var(--leise);margin:0}
.klein{font-size:.85rem}
.mitte{text-align:center}
.etikett{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--leise);font-weight:600;margin:0}
.karte{background:var(--flaeche);border:2px solid var(--text);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 0 var(--schatten)}
.feld{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--leise);font-weight:500}
.feld input{font:500 1.05rem var(--fliess);color:var(--text);background:var(--flaeche);border:2px solid var(--linie);border-radius:12px;padding:13px 14px;width:100%;outline:none}
.feld input:focus{border-color:var(--akzent)}
.knopf{appearance:none;border:2px solid var(--text);border-radius:14px;padding:15px 18px;font:700 1rem var(--fliess);background:var(--akzent);color:var(--akzent-text);width:100%;cursor:pointer;box-shadow:0 4px 0 var(--schatten)}
.knopf:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--schatten)}
.knopf.zweit{background:var(--flaeche);color:var(--text)}
.knopf:disabled{opacity:.45;cursor:default}
.knopf.stopp{font-family:var(--display);font-size:1.4rem;letter-spacing:.04em;padding:18px;background:var(--schlecht)}
button:focus-visible,input:focus-visible{outline:3px solid var(--eis);outline-offset:2px}
.reihe{display:flex;gap:10px}
.wahl{display:flex;gap:8px}
.wahl button,button.klein{appearance:none;border:2px solid var(--linie);background:var(--flaeche);color:var(--text);border-radius:999px;padding:8px 14px;font:600 .9rem var(--fliess);cursor:pointer}
.wahl button{flex:1}
.wahl button.an,button.klein.an{background:var(--text);color:var(--bg);border-color:var(--text)}
.link{background:none;border:0;color:var(--leise);text-decoration:underline;font:inherit;cursor:pointer;padding:8px;align-self:center}
.code{font-family:var(--display);font-weight:800;font-size:3.4rem;letter-spacing:.12em;line-height:1}
.qr{background:#fff;border:2px solid var(--text);border-radius:16px;padding:10px;width:200px;max-width:60%;align-self:center;box-shadow:0 4px 0 var(--schatten)}
.qr svg{display:block;width:100%;height:auto}
.spieler{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.spieler li{display:flex;align-items:center;gap:10px;font-weight:600}
.spieler small{color:var(--leise);font-weight:500}
.punkt{width:10px;height:10px;border-radius:50%;background:var(--linie);display:inline-block}
.punkt.an{background:var(--gut)}
.kats{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.status{position:sticky;top:0;z-index:5;background:var(--karte-gelb);color:var(--bg);border-radius:12px;padding:10px 12px;font-weight:600;font-size:.9rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.status{border:2px solid var(--text)}
.status button.klein{background:var(--flaeche);color:var(--text);border-color:var(--text)}
.spielkopf{display:flex;align-items:center;gap:16px}
.buchstabe{position:relative;width:112px;height:112px;flex:none;display:grid;place-items:center;transform:rotate(-8deg);filter:drop-shadow(0 4px 0 var(--schatten));animation:landen .5s cubic-bezier(.2,1.4,.4,1)}
.buchstabe svg{position:absolute;inset:0;width:100%;height:100%}
.buchstabe span{position:relative;font-family:var(--display);font-weight:800;font-size:3.3rem;line-height:1;color:#FFFDF7}
@keyframes landen{from{transform:rotate(-200deg) scale(.4);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.zeit{font-family:var(--display);font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums}
.stoppinfo{border:2px solid var(--text);background:var(--akzent);color:var(--akzent-text);font-family:var(--display);font-weight:800;border-radius:14px;padding:14px;text-align:center;font-size:1.15rem}
.felder{display:flex;flex-direction:column;gap:12px}
.unten{position:sticky;bottom:0;padding-block:12px calc(4px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);display:flex;flex-direction:column;gap:8px}
.antworten{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.antworten li{background:var(--flaeche2);border:1px solid var(--linie);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.antworten li.aus .text{text-decoration:line-through;color:var(--leise)}
.zeile1{display:flex;align-items:center;gap:8px}
.zeile1 .pkt{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.marke{font-size:.75rem;background:#FCE3D3;border-radius:999px;padding:2px 8px;color:var(--text)}
.text{font-size:1.05rem}
.knoepfe{display:flex;gap:8px;margin-top:2px}
.rang{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rang li{display:flex;align-items:center;gap:12px;background:var(--flaeche);border:2px solid var(--text);box-shadow:0 3px 0 var(--schatten);border-radius:14px;padding:12px 14px;font-variant-numeric:tabular-nums}
.rang .platz{font-family:var(--display);font-weight:800;width:1.5em;color:var(--leise)}
.rang li:first-child{background:#FFF0C2}
.rang li:first-child .platz{color:var(--akzent)}
.rang .n{flex:1;font-weight:600}
.rang .plus{color:var(--gut);font-weight:600}
.rang b{font-family:var(--display);font-size:1.15rem}
.wortmarke{font-size:clamp(1.5rem,7vw,2.1rem);line-height:1.1}
.wortmarke .w1{color:var(--eis)} .wortmarke .w2{color:var(--akzent)} .wortmarke .w3{color:var(--nuss)}
.code{color:var(--text)}
/* Uhr: Ring um den Kronkorken */
.uhr{position:relative;width:140px;height:140px;flex:none;display:grid;place-items:center}
.uhr .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.uhr .bahn{fill:none;stroke:var(--linie);stroke-width:8}
.uhr .rest{fill:none;stroke:var(--flasche);stroke-width:8;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear,stroke .3s}
.uhr.knapp .rest{stroke:var(--schlecht)}
.uhr .buchstabe{width:100px;height:100px}
.uhr .buchstabe span{font-size:3rem}
.uhr.knapp + div .zeit{color:var(--schlecht)}
/* Antworten wie auf dem Spielzettel: Karopapier, Kuli-Schrift */
.zettel{background-color:#fff;background-image:linear-gradient(var(--karo) 1px,transparent 1px),linear-gradient(90deg,var(--karo) 1px,transparent 1px);background-size:16px 16px;
  border:2px solid var(--text);border-radius:6px;box-shadow:0 4px 0 var(--schatten);padding:12px 14px 6px;gap:4px}
.zettel .feld{font:700 1.15rem var(--hand);color:var(--kuli);gap:0;border-bottom:2px solid var(--kuli);padding-bottom:2px}
.zettel .feld:last-child{border-bottom:0}
.zettel .feld input{font:600 1.65rem var(--hand);color:var(--kuli);background:transparent;border:0;border-radius:0;padding:2px 2px 4px}
.zettel .feld input::placeholder{color:#9FB2D6}
.zettel .feld input:focus{background:rgba(255,212,71,.28)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"><p class="leise">Lädt …</p></main>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="../netz.js"></script>
<script src="../abend.js?v=2026-11-19d" data-spiel="buchstabenbattle"></script>
<script src="logic.js"></script>
<script src="app.js?v=2026-11-19b"></script>
</body>
</html>

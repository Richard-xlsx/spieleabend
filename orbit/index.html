<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orbit">
<meta name="theme-color" content="#0B1026">
<title>Orbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,700;0,900;1,900&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Orbit: Nachtblau mit Sternen, Neon-Türkis, Signalorange, Kristallgelb */
:root{
  --bg:#0B1026; --flaeche:#141B3D; --flaeche2:#1C2550; --text:#EAF2FF; --leise:#9AA7D1; --linie:#2A3568;
  --akzent:#2EC4B6; --akzent-text:#06121C; --orange:#FF7A2F; --gelb:#FFD23F; --pink:#FF5C9A; --gut:#7BD957;
  --display:"Exo 2","Segoe UI",system-ui,sans-serif; --fliess:"Inter","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;color:var(--text);font:16px/1.45 var(--fliess);-webkit-text-size-adjust:100%}
html{background:var(--bg)}
body{min-height:100vh;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  background:
    radial-gradient(1px 1px at 12% 8%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 78% 14%,#fff9 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 40% 30%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 88% 46%,#fff8 50%,transparent 51%),
    radial-gradient(1px 1px at 22% 62%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 64% 78%,#fff7 50%,transparent 51%),
    radial-gradient(1px 1px at 8% 92%,#fff8 50%,transparent 51%),radial-gradient(ellipse at 100% 0%,#2EC4B61a,transparent 55%),
    radial-gradient(ellipse at 0% 100%,#A57BFF1a,transparent 55%),var(--bg);
  background-attachment:fixed}
#app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2{font-family:var(--display);margin:0;letter-spacing:.02em;text-wrap:balance}
h1{font-size:1.9rem;line-height:1.1;font-weight:900}
h2{font-size:1rem;font-weight:700}
.titel{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.titel h1{font-size:2.6rem;font-style:italic;letter-spacing:.06em;color:var(--akzent);text-shadow:0 0 18px #2EC4B655}
.leise{color:var(--leise);margin:0}
.mitte{text-align:center;margin:0}
.klein{font-size:.86rem}
.gross{font-size:1.1rem}
.etikett{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--leise);font-weight:600;margin:0}
.baustelle{margin:0;border:1px dashed var(--orange);color:#FFC59E;border-radius:12px;padding:8px 12px;font-size:.86rem}
.karte-box{background:color-mix(in srgb,var(--flaeche) 92%,transparent);border:1px solid var(--linie);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.feld{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--leise);font-weight:500}
.feld input{font:500 1.05rem var(--fliess);color:var(--text);background:var(--flaeche2);border:1px solid var(--linie);border-radius:12px;padding:13px 14px;width:100%;outline:none}
.feld input:focus{border-color:var(--akzent)}
.knopf{appearance:none;border:0;border-radius:14px;padding:14px 16px;font:700 1rem var(--fliess);background:var(--akzent);color:var(--akzent-text);width:100%;cursor:pointer}
.knopf.zweit{background:transparent;color:var(--text);border:1px solid var(--linie)}
.knopf:disabled{opacity:.4;cursor:default}
.klein-knopf{width:auto;padding:10px 14px;font-size:.9rem;flex:none}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--gelb);outline-offset:2px}
.reihe{display:flex;gap:10px}
.link{background:none;border:0;color:var(--leise);text-decoration:underline;font:inherit;cursor:pointer;padding:8px;align-self:center}
.code{font-family:var(--display);font-weight:900;font-size:3.2rem;letter-spacing:.12em;line-height:1;color:var(--gelb)}
.qr{background:#fff;border-radius:16px;padding:10px;width:200px;max-width:60%;align-self:center}
.qr svg{display:block;width:100%;height:auto}
.status{position:sticky;top:0;z-index:5;background:var(--gelb);color:var(--bg);border-radius:12px;padding:10px 12px;font-weight:600;font-size:.9rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.status button.klein{appearance:none;border:0;background:var(--bg);color:var(--text);border-radius:999px;padding:8px 12px;font:600 .85rem var(--fliess)}
.unten{position:sticky;bottom:0;padding-block:10px calc(4px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);display:flex;flex-direction:column;gap:8px;z-index:3}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);font-weight:600;padding:10px 16px;border-radius:12px;z-index:20;max-width:90vw;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.titelbild{display:block;width:100%;height:auto;max-width:380px;align-self:center;margin:4px 0}
.tb-puls{animation:tbpuls 2.4s infinite ease-out;transform-origin:150px 76px}
@keyframes tbpuls{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.8);opacity:0}}
.tb-blink{animation:tbblink 1.2s infinite steps(2)}
@keyframes tbblink{50%{opacity:.2}}

.helm{width:30px;height:30px;flex:none;display:block}
.gross .helm{display:inline-block;vertical-align:middle;width:34px;height:34px;margin-right:4px}
.spieler{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.spieler li{display:flex;align-items:center;gap:10px;font-weight:600}
.spieler .nm{flex:1;min-width:0}
.spieler small{color:var(--leise);font-weight:500}
.energie{font:700 1rem var(--display);color:var(--gelb)}
.energie i,.plus i{font-style:normal;font-size:.8em;margin-left:2px}
.farbwahl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.farbknopf{appearance:none;border:2px solid var(--linie);background:var(--flaeche2);color:var(--text);border-radius:14px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font:600 .72rem var(--fliess);min-width:0}
.farbknopf .helm{width:38px;height:38px}
.farbknopf small{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.farbknopf.an{border-color:var(--akzent);box-shadow:0 0 0 3px #2EC4B633}
.farbknopf:disabled{opacity:.4;cursor:default}
.mission{display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--linie);padding-top:12px}
.mission:first-of-type{border-top:0;padding-top:0}
.mission b{font-family:var(--display);font-size:.95rem;display:block}
.mission small{color:var(--leise);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
.mission p{margin:4px 0 0}

.missionstitel{display:flex;flex-direction:column;gap:4px;text-align:center;padding-top:4px}
.missionstitel h1{font-size:1.6rem;color:var(--akzent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{border:1px solid var(--linie);border-radius:999px;padding:3px 10px;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--leise)}
.regeln{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--leise)}
.regeln b{color:var(--text)}
.helmreihe{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.helmreihe .helm{width:34px;height:34px}
.helmreihe .blass{opacity:.3}
.countdown{font:900 6rem/1 var(--display);text-align:center;color:var(--gelb);min-height:1.2em;padding:30px 0;text-shadow:0 0 30px #FFD23F66}
.countdown.puls{animation:cd .9s ease-out}
@keyframes cd{0%{transform:scale(1.6);opacity:0}30%{opacity:1}100%{transform:scale(1)}}
.missionskopf{display:flex;justify-content:space-between;align-items:center}
.uhr{font:900 1.3rem var(--display);color:var(--akzent);min-width:2.2em;text-align:right}
.uhr.knapp{color:var(--orange)}
.missionsfeld{display:flex;flex-direction:column;gap:12px}

/* Funkfrequenz */
.frequenzen{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.frequenz{appearance:none;aspect-ratio:1;border:2px solid var(--linie);border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--flaeche2),var(--flaeche));color:var(--text);font:900 1.25rem var(--display);cursor:pointer;display:grid;place-items:center;position:relative;touch-action:manipulation}
.frequenz:disabled{opacity:.5;cursor:default}
.frequenz.an{border-color:var(--akzent);background:var(--akzent);color:var(--akzent-text);box-shadow:0 0 0 4px #2EC4B633,0 0 22px #2EC4B688}
.frequenz.an::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--akzent);opacity:0;animation:welle 1.6s infinite ease-out}
@keyframes welle{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.punkteleiste{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.punkteleiste span{display:flex;align-items:center;gap:4px;background:var(--flaeche);border:1px solid var(--linie);border-radius:999px;padding:3px 10px 3px 4px}
.punkteleiste .helm{width:24px;height:24px}
.punkteleiste b{font-family:var(--display);font-size:.9rem}
.punkteleiste .ich{border-color:var(--akzent)}
.aufloesung{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.aufloesung li{display:flex;align-items:center;gap:10px;background:var(--flaeche);border:1px solid var(--linie);border-radius:14px;padding:8px 12px}
.aufloesung .fnr{font:900 1.3rem var(--display);width:2em;text-align:center}
.aufloesung .wer{flex:1;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.aufloesung .wer .helm{width:26px;height:26px}
.aufloesung .wer small{font-weight:600;margin-left:-6px}
.aufloesung .was{font-weight:700;font-size:.85rem;color:var(--leise)}
.aufloesung .sieg{border-color:var(--gelb);background:#FFD23F1a}
.aufloesung .sieg .was{color:var(--gelb);font:900 1.1rem var(--display)}
.aufloesung .gestoert{opacity:.7}
.aufloesung .gestoert .fnr{text-decoration:line-through;color:var(--orange)}

.ergebnis{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ergebnis li{display:flex;align-items:center;gap:10px;font-weight:600}
.ergebnis .pl{font:900 1rem var(--display);width:1.8em;color:var(--leise)}
.ergebnis .nm{flex:1;display:flex;flex-direction:column}
.ergebnis .nm small{color:var(--leise);font-weight:500}
.ergebnis .plus{font:900 1.1rem var(--display);color:var(--gelb)}
.ergebnis .erster .pl{color:var(--gelb)}
.ergebnis .ich .nm{color:var(--akzent)}
.rueckblick summary{cursor:pointer;color:var(--leise);text-align:center;padding:4px}
.rueckblick[open]{display:flex;flex-direction:column;gap:10px}
/* Lobby: Partie */
.laengen{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.laenge{appearance:none;border:2px solid var(--linie);background:var(--flaeche2);color:var(--text);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font:600 .95rem var(--fliess);min-width:0}
.laenge small{font-size:.68rem;color:var(--leise);font-weight:500;text-align:center}
.laenge.an{border-color:var(--akzent);box-shadow:0 0 0 3px #2EC4B633}
.uebung summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
.uebung summary::-webkit-details-marker{display:none}
.uebung summary::after{content:"+";font:900 1.3rem var(--display);color:var(--leise)}
.uebung[open] summary::after{content:"−"}

/* Spielbrett */
.brettrahmen{margin:0 -6px}
.brett{display:block;width:100%;height:auto;max-width:440px;margin:0 auto}
.brett .figur{transition:transform .26s ease-in-out}
.brett .figur.zieht{filter:drop-shadow(0 0 6px #fff8)}
.brett .meinring{fill:none;stroke:var(--akzent);stroke-width:2.5;animation:meinring 1.6s infinite ease-in-out}
@keyframes meinring{50%{stroke-opacity:.3}}
.brett .haendlerring{fill:none;stroke:var(--gelb);stroke-width:2.5;stroke-dasharray:4 4;animation:drehen 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes drehen{to{transform:rotate(360deg)}}
.brett .schiff{filter:drop-shadow(0 0 5px #FFD23F88)}
.brett .hubklein{font:700 10px var(--fliess);letter-spacing:.14em;fill:var(--leise);text-anchor:middle}
.brett .hubklein.doppelt{fill:var(--orange)}
.brett .hubgross{font:900 34px var(--display);fill:var(--text);text-anchor:middle}
.brett .hubvon{font-size:18px;fill:var(--leise)}
.brett .hubpuls{animation:meinring 3s infinite ease-in-out}
.panel{gap:10px}
.panelkopf{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wuerfel{width:26px;height:26px;display:inline-block;vertical-align:middle}
.wuerfelpaar{display:flex;gap:4px}
.wuerfelknopf{display:flex;align-items:center;justify-content:center;gap:8px;font-size:1.15rem;padding:16px}
.wuerfelknopf .wuerfel{width:30px;height:30px}
.wuerfelknopf.rollt .wuerfel{animation:rollen .35s infinite linear}
@keyframes rollen{50%{transform:rotate(25deg) scale(1.1)}}
.liste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.liste li{display:flex;align-items:center;gap:10px;font-weight:600}
.liste .helm{width:26px;height:26px}
.liste .nm{flex:1;min-width:0}
.zugkarte{display:flex;gap:12px;align-items:flex-start;background:var(--flaeche2);border-radius:14px;padding:12px}
.zugkarte>.helm{width:40px;height:40px}
.zugkarte>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.feldzeile{display:flex;gap:8px;align-items:center;margin:0}
.feldzeile .feldicon,.feldzeile .kristall{flex:none}
.knoepfe{display:flex;flex-direction:column;gap:8px}
.wahlknopf{display:flex;align-items:center;gap:10px;text-align:left}
.wahlknopf span{flex:1}
.wahlknopf small{color:var(--leise);font-weight:500}
.missionskarte{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--flaeche2);border-radius:14px;padding:12px}
.missionskarte b{font-family:var(--display);font-size:1rem;display:block}
.missionskarte small{color:var(--leise);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.missionskarte p{margin:4px 0 0}
.tipps{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tippknopf{appearance:none;border:2px solid var(--linie);background:var(--flaeche2);color:var(--text);border-radius:14px;padding:6px 4px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;width:68px;font:600 .72rem var(--fliess)}
.tippknopf .helm{width:34px;height:34px}
.tippknopf small{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tippknopf.an{border-color:var(--gelb);box-shadow:0 0 0 3px #FFD23F33}
.einsaetze{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.einsatz{appearance:none;width:42px;height:42px;border-radius:50%;border:2px solid var(--linie);background:var(--flaeche2);color:var(--text);font:900 1.05rem var(--display);cursor:pointer}
.einsatz.an{border-color:var(--gelb);background:var(--gelb);color:var(--bg)}
.einsatz:disabled{opacity:.3;cursor:default}
.gratis{display:inline-block;margin-top:4px;background:#4DA3FF26;border:1px solid #4DA3FF;color:#BFDcff;border-radius:999px;padding:2px 10px;font-size:.82rem}
.logbuch{list-style:none;margin:0;padding:0 4px;display:flex;flex-direction:column;gap:3px;font-size:.84rem;color:var(--leise)}
.logbuch li:last-child{color:var(--text)}
.logbuch li::before{content:"› ";color:var(--akzent)}
.kristall{width:13px;height:15px;display:inline-block;vertical-align:-2px}
.stand{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.stand li{display:flex;align-items:center;gap:10px;font-weight:600}
.stand .pl{font:900 .95rem var(--display);width:1.6em;color:var(--leise)}
.stand .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.stand .nm small{color:var(--leise);font-weight:500;font-size:.75rem}
.stand .kr{font:900 1.05rem var(--display);color:var(--gelb);display:flex;align-items:center;gap:3px;min-width:2.4em;justify-content:flex-end}
.stand .energie{min-width:3em;text-align:right}
.stand .ich .nm{color:var(--akzent)}
.stand .erster .pl{color:var(--gelb)}
.legende{background:var(--flaeche);border:1px solid var(--linie);border-radius:18px;padding:12px 16px}
.legende summary{cursor:pointer;font-weight:600}
.legende ul{list-style:none;margin:10px 0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:.88rem}
.legende li{display:flex;gap:10px;align-items:flex-start}
.legende li b{display:block}
.legende .feldicon,.legende .kristall{flex:none;margin-top:2px}
.doppeltzeile{margin:0;color:var(--orange);font-weight:700;font-size:.9rem}
.wettliste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.wettliste li{display:flex;align-items:center;gap:10px;font-weight:600}
.wettliste .helm{width:26px;height:26px}
.wettliste .nm{flex:1;display:flex;flex-direction:column}
.wettliste small{color:var(--leise);font-weight:500}
.wettliste .plus{font:900 1rem var(--display);color:var(--leise)}
.wettliste .richtig .plus{color:var(--gelb)}

/* Siegerehrung */
.podest{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.podest span{display:flex;flex-direction:column;align-items:center;gap:6px;font:900 1.1rem var(--display)}
.helm.riesig{width:96px;height:96px;filter:drop-shadow(0 0 18px #FFD23F66);animation:schweben 3s ease-in-out infinite}
@keyframes schweben{50%{transform:translateY(-6px)}}
.bonus{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.bonus li{display:flex;align-items:center;gap:10px}
.bonus li>div{flex:1;display:flex;flex-direction:column}
.bonus small{color:var(--leise)}
.bonus .helme{display:flex;gap:2px}
.bonus .helm{width:28px;height:28px}
.bonus .kr{font:900 1rem var(--display);color:var(--gelb);display:flex;align-items:center;gap:3px}
/* Schrotthändler */
.auktion{display:flex;align-items:center;gap:14px;justify-content:center;background:var(--flaeche);border:1px solid var(--linie);border-radius:18px;padding:10px 14px}
.auktion h3{margin:0;font:800 1.2rem var(--display)}
.auktion .wert{margin:2px 0 0;font:900 1.5rem var(--display);color:var(--gelb)}
.teil{width:40px;height:40px;flex:none}
.teil.gross{width:76px;height:76px}
.gebotsfeld{display:flex;flex-direction:column;gap:10px}
.stepper{display:flex;align-items:center;justify-content:center;gap:8px}
.stepper output{font:900 2.6rem/1 var(--display);min-width:2.2em;text-align:center;color:var(--akzent)}
.rund{appearance:none;width:48px;height:48px;border-radius:50%;border:2px solid var(--linie);background:var(--flaeche2);color:var(--text);font:800 1rem var(--display);cursor:pointer;touch-action:manipulation}
.schnell{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chipknopf{appearance:none;border:1px solid var(--linie);background:var(--flaeche);color:var(--text);border-radius:999px;padding:8px 14px;font:600 .9rem var(--fliess);cursor:pointer}
.teilereihe{list-style:none;margin:0;padding:0;display:flex;gap:6px;justify-content:center}
.teilereihe li{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--linie);border-radius:12px;padding:4px 6px;min-width:48px}
.teilereihe .teil{width:30px;height:30px}
.teilereihe b{font:800 .9rem var(--display);color:var(--gelb)}
.teilereihe small{font-size:.65rem;color:var(--leise)}
.teilereihe .jetzt{border-color:var(--akzent);background:#2EC4B61a}
.teilereihe .vorbei{opacity:.45}
.punkteleiste .credits{font-size:.7rem;color:var(--leise)}
/* Reaktor-Countdown */
.reaktor{width:min(220px,60vw);height:auto;display:block;margin:0 auto}
.reaktor .reaktor-knall{opacity:0;transform-origin:100px 100px}
.reaktor.aus .reaktor-glut{fill:#26305E}.reaktor.aus .reaktor-kern{fill:#3A4680}.reaktor.aus .reaktor-ring{stroke:#2A3568}
.reaktor.heiss .reaktor-glut{animation:glut .5s infinite alternate ease-in-out;transform-origin:100px 100px}
.reaktor.heiss .reaktor-ring{animation:dreh 2s linear infinite;transform-origin:100px 100px}
.reaktor.drinnen .reaktor-ring{animation:dreh 3s linear infinite;transform-origin:100px 100px}
.reaktor.knall .reaktor-knall{opacity:1;animation:knall .6s ease-out}
.reaktor.knall .reaktor-glut,.reaktor.knall .reaktor-kern{opacity:0}
@keyframes glut{from{transform:scale(.92);fill:#FFD23F}to{transform:scale(1.06);fill:#FF7A2F}}
@keyframes dreh{to{transform:rotate(360deg)}}
@keyframes knall{from{transform:scale(.2)}to{transform:scale(1)}}
.reaktorwert{font:900 3.4rem/1 var(--display);color:var(--gelb);margin:0;text-shadow:0 0 24px #FFD23F55}
.knopf.raus{background:var(--pink);color:#1A0610;font:900 1.5rem var(--display);padding:20px}
.reaktorliste .fnr{width:2.6em}

/* Live-Missionen: Arena und Steuerung */
.arena-rahmen{width:min(100%,460px);margin:0 auto;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#141B3D 0%,#0B1026 70%);box-shadow:inset 0 0 40px #000}
.arena{width:100%;height:100%;display:block;touch-action:none}
.steuerleiste{display:flex;gap:12px;align-items:center;justify-content:space-between}
.daumenfeld{width:132px;height:132px;border-radius:50%;border:2px solid var(--linie);background:radial-gradient(circle,var(--flaeche2),var(--flaeche));position:relative;touch-action:none;flex:none;display:grid;place-items:center}
.daumenfeld .knauf{width:56px;height:56px;border-radius:50%;background:var(--akzent);box-shadow:0 0 18px #2EC4B666;pointer-events:none;transition:transform .05s linear}
.neigehinweis{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--leise);font-size:.85rem}
.neigehinweis svg{width:40px;height:40px;animation:wackeln 2.4s ease-in-out infinite}
@keyframes wackeln{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
.aktionsknopf{appearance:none;border:0;flex:1;min-height:110px;border-radius:24px;background:var(--orange);color:#1A0A02;font:900 1.4rem var(--display);cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.aktionsknopf.saat{background:#8BD346;color:#0C2A05}
.aktionsknopf[data-leer]{opacity:.35;filter:saturate(.3)}
.arena-rahmen.eckig{border-radius:18px}
.arena-rahmen.frei{aspect-ratio:auto;background:none;box-shadow:none;overflow:hidden}
.arena-rahmen.frei .arena{height:auto}
.greifrahmen{width:min(100%,calc((100vh - 300px) * 1.25),520px)}
.kuechenrahmen{width:min(100%,calc((100vh - 300px) * .8),460px)}
.boulerahmen{width:min(100%,calc((100vh - 290px) * .69),440px)}
.aktionsknopf.greifen{background:#2EC4B6;color:#03201D}
.aktionsknopf.gehen{background:#7BD957;color:#0C2A05;touch-action:none;-webkit-touch-callout:none}
.aktionsknopf.gehen.gedrueckt{filter:brightness(1.25);transform:scale(.97)}
.boulefeld.zielbar{cursor:crosshair}
.bouledran{color:var(--akzent)}
.punkteleiste small{font-size:.6rem;color:var(--leise);letter-spacing:-1px}
.lenkknoepfe{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gwtext{flex:1;margin:0;text-align:left}
.verdachtleiste{display:flex;justify-content:center}
.verdachtknopf{min-width:min(100%,280px);background:var(--orange);color:#1A0A02}
.verdachtknopf:disabled{opacity:.4}
.einersatz{text-align:center;font:900 1.25rem var(--display);margin:0 0 10px}
.einersatz.alien{color:#7BD957}
.einersatz.crew{color:var(--akzent)}
.lenkknopf{appearance:none;border:2px solid var(--linie);min-height:120px;border-radius:24px;background:var(--flaeche2);color:var(--text);cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;display:grid;place-items:center}
.lenkknopf svg{width:48px;height:48px;pointer-events:none}
.lenkknopf.gedrueckt{background:var(--akzent);color:#04201D;border-color:var(--akzent)}
.aktionsknopf.oel{background:#4B2FA8;color:var(--text)}
.aktionsknopf.blitz{animation:blitz .3s ease-out}
@keyframes blitz{from{transform:scale(.92);filter:brightness(1.5)}to{transform:scale(1)}}
/* Rettungskapseln */
.sirene{border-radius:18px;padding:16px;text-align:center;font:900 1.15rem var(--display);background:var(--flaeche);border:2px solid var(--linie);color:var(--leise)}
.sirene[data-zustand="echt"]{background:#FF3B3B;border-color:#FF9C9C;color:#fff;animation:sirene .35s infinite alternate}
.sirene[data-zustand="test"]{background:#FFB020;border-color:#FFE08A;color:#2A1A00;animation:sirene .35s infinite alternate}
@keyframes sirene{from{filter:brightness(1)}to{filter:brightness(1.35)}}
.missionsfeld.alarm-echt::before,.missionsfeld.alarm-test::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:#FF3B3B1f}
.missionsfeld.alarm-test::before{background:#FFB0201f}
.kapseln{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px}
.kapsel{appearance:none;position:relative;aspect-ratio:1;border-radius:24px;border:3px solid var(--linie);background:var(--flaeche);cursor:pointer;padding:10px;opacity:.55;transition:opacity .1s,transform .1s;touch-action:manipulation}
.kapsel svg{width:100%;height:100%}
.kapsel.offen{opacity:1;border-color:var(--text);transform:scale(1.03)}
.kapsel.besetzt{opacity:1;border-color:var(--linie);background:#0A1030}
.kapsel.mein{border-color:var(--gut);box-shadow:0 0 0 4px #7BD95744}
.kapsel:disabled{cursor:default}
.kapsel .insasse{position:absolute;inset:0;display:grid;place-items:center}
.kapsel .insasse .helm{width:46%;height:46%}
.ausloeser{background:var(--flaeche);border:1px solid var(--linie);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.zweier{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.alarmknopf{background:#FF3B3B;color:#fff}
.testknopf{background:#FFB020;color:#2A1A00}
.testknopf:disabled{opacity:.4}

@media (prefers-reduced-motion:reduce){.neigehinweis svg,.sirene[data-zustand],.aktionsknopf.blitz{animation:none}}
@media (prefers-reduced-motion:reduce){.reaktor.heiss .reaktor-glut,.reaktor .reaktor-ring,.reaktor.knall .reaktor-knall{animation:none}}
@media (prefers-reduced-motion:reduce){.tb-puls,.tb-blink,.countdown.puls,.frequenz.an::after,.brett .meinring,.brett .haendlerring,.brett .hubpuls,.helm.riesig,.wuerfelknopf.rollt .wuerfel{animation:none}.brett .figur{transition:none}}
</style>

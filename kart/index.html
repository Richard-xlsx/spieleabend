<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kerker-Kart">
<meta name="theme-color" content="#140F14">
<title>Kerker-Kart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Inter:wght@500;600;700;800&display=swap">
<style>
/* Kerker-Kart (Arbeitstitel): Fun-Racer im Querformat mit den Helden aus Dungeons & Disappointments. Pergament, Tinte, Rötel */
:root{--tinte:#2A1A12;--creme:#FFF6E6;--rot:#E23B2E;--senf:#F2B705;--blau:#2F6FDE;--leise:#7A6658;
  --display:"Unbounded","Segoe UI",system-ui,sans-serif;--fliess:"Inter","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#140F14;color:var(--tinte);font:15px/1.4 var(--fliess);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100dvh}
.hud{position:fixed;inset:0;pointer-events:none;
  padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.hud>*{position:absolute}
.platz{left:max(16px,env(safe-area-inset-left));top:8px;font:900 50px/1 var(--display);color:#fff;-webkit-text-stroke:3px var(--tinte);paint-order:stroke;letter-spacing:-2px}
.platz small{font-size:19px;-webkit-text-stroke:2px var(--tinte);margin-left:4px;letter-spacing:0}
.runde{left:max(18px,env(safe-area-inset-left));top:66px;background:var(--creme);border:2.5px solid var(--tinte);border-radius:12px;padding:2px 10px;font:800 13px var(--fliess)}
.uhr{right:calc(max(14px,env(safe-area-inset-right)) + 74px);top:18px;background:var(--creme);border:2.5px solid var(--tinte);border-radius:12px;padding:2px 10px;font:800 14px var(--fliess);font-variant-numeric:tabular-nums}
.extra{right:max(14px,env(safe-area-inset-right));top:8px;width:62px;height:62px;border-radius:16px;background:var(--creme);border:3px solid var(--tinte);display:grid;place-items:center;box-shadow:0 4px 0 var(--tinte)}
.extra .ico{font-size:36px;line-height:1;display:grid;place-items:center}
.extra .ico svg{display:block}
.extra .ico.walzt{filter:blur(.6px);transform:translateY(2px)}
.extra .anz{position:absolute;right:-8px;bottom:-8px;background:var(--rot);color:#fff;border:2.5px solid var(--tinte);border-radius:999px;padding:0 6px;font:900 12px var(--fliess)}
/* Fledermäuse vor dem Bild, Sporenwolke, Schüttel-Hinweis */
.fleder{inset:0;overflow:hidden}
.fleder span{position:absolute;font-size:64px;animation:flattern 1.1s ease-in-out infinite alternate}
.fleder span:nth-child(1){left:12%;top:18%}.fleder span:nth-child(2){left:42%;top:30%;font-size:88px;animation-duration:.8s}
.fleder span:nth-child(3){left:66%;top:12%;animation-duration:1.3s}.fleder span:nth-child(4){left:30%;top:52%;font-size:52px;animation-duration:.9s}
.fleder span:nth-child(5){left:58%;top:48%;font-size:76px}
@keyframes flattern{0%{transform:translate(-30px,10px) scaleX(1)}50%{transform:translate(20px,-24px) scaleX(-1)}100%{transform:translate(50px,16px) scaleX(1)}}
.vorschau{left:50%;top:86px;transform:translateX(-50%);background:var(--creme);border:3px solid var(--tinte);border-radius:16px;box-shadow:0 4px 0 var(--tinte);padding:6px 16px;display:flex;flex-direction:column;align-items:center;white-space:nowrap}
.vorschau b{font:900 17px var(--display)} .vorschau small{font:700 11px var(--fliess);color:var(--leise);letter-spacing:.06em}
.sporen{inset:0;background:radial-gradient(circle at 50% 55%,rgba(150,220,90,.55),rgba(90,170,50,.92) 70%);transition:opacity .2s}
.schuettel{left:50%;top:34%;transform:translateX(-50%);font:900 30px var(--display);color:#fff;-webkit-text-stroke:3px var(--tinte);paint-order:stroke;animation:ruetteln .18s infinite alternate}
@keyframes ruetteln{from{transform:translateX(-52%) rotate(-3deg)}to{transform:translateX(-48%) rotate(3deg)}}
.extra.neu{animation:hupf .35s}
@keyframes hupf{50%{transform:scale(1.18)}}
.mini{left:max(12px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));width:104px;height:84px;background:rgba(243,230,204,.85);border:2.5px solid var(--tinte);border-radius:14px}
.lenk{left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(22,22,29,.6);color:#fff;border-radius:999px;padding:4px 12px 4px 6px;font:700 12px var(--fliess)}
.lenk svg{transition:transform .05s linear}
.knopf{pointer-events:auto;border-radius:50%;border:3px solid var(--tinte);display:grid;place-items:center;font:900 13px var(--fliess);box-shadow:0 4px 0 var(--tinte);touch-action:none}
.knopf.an{transform:translateY(3px);box-shadow:0 1px 0 var(--tinte)}
.k-extra{left:calc(max(12px,env(safe-area-inset-left)) + 118px);bottom:max(14px,env(safe-area-inset-bottom));width:88px;height:88px;background:rgba(226,59,46,.85);color:#fff}
.k-drift{right:max(18px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:80px;height:80px;background:rgba(242,183,5,.85)}
.k-kraft{right:calc(max(18px,env(safe-area-inset-right)) + 8px);bottom:calc(max(14px,env(safe-area-inset-bottom)) + 94px);width:64px;height:64px;padding:5px;
  background:conic-gradient(var(--senf) calc(var(--k,0) * 1turn),rgba(42,26,18,.6) 0)}
.k-kraft .bild{width:100%;height:100%;border-radius:50%;background:var(--creme);border:2px solid var(--tinte);display:grid;place-items:center;font-size:24px}
.k-kraft .bild svg{width:34px;height:29px;display:block}
.k-kraft:not(.voll) .bild{filter:grayscale(.8) brightness(.85)}
.k-kraft.voll{animation:glimm .5s ease-in-out infinite alternate}
@keyframes glimm{to{box-shadow:0 4px 0 var(--tinte),0 0 20px 7px rgba(242,183,5,.95)}}
.gold{right:max(14px,env(safe-area-inset-right));top:82px;background:var(--creme);border:2.5px solid var(--tinte);border-radius:999px;padding:1px 9px 1px 5px;font:800 13px var(--fliess);display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.gold i{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE27A,#F2B705 55%,#B07D00);border:1.5px solid var(--tinte)}
.gold.neu{animation:hupf .3s}
.tasten .k-extra{left:auto;right:calc(max(18px,env(safe-area-inset-right)) + 92px);bottom:max(14px,env(safe-area-inset-bottom))}
.k-links,.k-rechts{bottom:max(14px,env(safe-area-inset-bottom));width:80px;height:80px;background:rgba(255,246,230,.85);font-size:26px}
.k-links{left:calc(max(12px,env(safe-area-inset-left)) + 118px)} .k-rechts{left:calc(max(12px,env(safe-area-inset-left)) + 208px)}
.tag{transform:translate(-50%,-100%);background:rgba(22,22,29,.72);color:#fff;font:700 12px var(--fliess);padding:2px 8px;border-radius:999px;white-space:nowrap}
.gross{left:50%;top:38%;transform:translate(-50%,-50%);font:900 92px/1 var(--display);color:#fff;-webkit-text-stroke:4px var(--tinte);paint-order:stroke}
.gross.klein{font-size:40px}
.meldung{left:50%;top:22%;transform:translateX(-50%);background:var(--creme);border:2.5px solid var(--tinte);border-radius:999px;padding:4px 14px;font:800 14px var(--fliess);white-space:nowrap}
.pause{pointer-events:auto;right:calc(max(14px,env(safe-area-inset-right)) + 74px);top:52px;width:36px;height:36px;border-radius:10px;background:var(--creme);border:2.5px solid var(--tinte);font:900 14px var(--fliess);display:grid;place-items:center}

.schicht{position:fixed;inset:0;display:grid;place-items:center;background:rgba(20,15,20,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);overflow:auto;touch-action:pan-y;
  padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.kasten{background:var(--creme);border:3px solid var(--tinte);border-radius:22px;box-shadow:0 6px 0 var(--tinte);padding:12px 16px;margin:auto;width:min(640px,100%);display:flex;flex-direction:column;gap:10px}
h1{font:900 26px/1.05 var(--display);margin:0;letter-spacing:-.02em} h1 span{color:var(--rot)}
.leise{color:var(--leise);margin:0;font-size:13px}
.zeile{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.zeile>b{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--leise);min-width:82px}
.wahl{appearance:none;border:2.5px solid var(--tinte);background:#fff;border-radius:12px;padding:6px 10px;font:700 13px var(--fliess);color:var(--tinte);display:flex;align-items:center;gap:6px;cursor:pointer}
.wahl.an{background:var(--tinte);color:#fff}
.los{appearance:none;border:3px solid var(--tinte);background:var(--rot);color:#fff;border-radius:14px;padding:10px 18px;font:900 17px var(--display);box-shadow:0 4px 0 var(--tinte);cursor:pointer}
.los.zweit{background:#fff;color:var(--tinte)}
.zurueck{color:var(--leise);font-weight:700;font-size:13px}
table{border-collapse:collapse;font-variant-numeric:tabular-nums} td{padding:2px 12px 2px 0}
.kasten.breit{width:min(780px,100%)}
.spalten{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start}
@media (max-width:620px){.spalten{grid-template-columns:1fr}}
.stapel{display:flex;flex-direction:column;gap:8px}
.box{border:2px solid var(--tinte);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;background:#fff}
.titelchen{font:800 14px var(--display)}
.feld{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--leise);text-transform:uppercase;letter-spacing:.08em}
input{font:700 16px var(--fliess);color:var(--tinte);background:#fff;border:2.5px solid var(--tinte);border-radius:12px;padding:7px 10px;min-width:0;text-transform:none;letter-spacing:0}
input.fehlt{border-color:var(--rot)}
#code{width:100px;text-transform:uppercase;letter-spacing:.15em;font-weight:900}
.los.klein{font-size:14px;padding:7px 12px}
.knopflos{appearance:none;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.etikett{margin:0;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--leise)}
.code{font:900 40px/1 var(--display);letter-spacing:.08em}
/* Zuschauen, Feldzug, Flüche, Siegerehrung */
.zuschau{pointer-events:auto;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--creme);border:2.5px solid var(--tinte);border-radius:999px;padding:4px 6px 4px 14px;font:700 13px var(--fliess);white-space:nowrap;box-shadow:0 3px 0 var(--tinte)}
.zuschau small{color:var(--leise);font-weight:600}
.zuschau button{appearance:none;border:2px solid var(--tinte);background:#fff;border-radius:999px;padding:4px 10px;font:800 12px var(--fliess);color:var(--tinte);cursor:pointer}
.hud.zuschauer :is(.knopf,.lenk,.extra,.gold){display:none!important}
.fluchwahl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fluch{appearance:none;border:2.5px solid var(--tinte);background:#fff;border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 12px var(--fliess);color:var(--tinte);cursor:pointer;text-align:center}
.fluch b{font:800 14px var(--display)} .fluch .bild{font-size:30px;line-height:1}
.fluch:hover{background:#F2C14E}
.fluchschild{display:inline-flex;align-items:center;gap:6px;background:#2A1A12;color:#fff;border-radius:999px;padding:2px 10px;font:700 12px var(--fliess)}
.wertung td.pkt{font-weight:900;text-align:right} .wertung td.plus{color:#2E9B4F;font-weight:800;text-align:right}
.wertung tr.ich td{background:#F2C14E55}
#ziel.ehrung{background:none;backdrop-filter:none;-webkit-backdrop-filter:none;place-items:end end}
#ziel.ehrung .kasten{width:min(360px,100%);margin:0;max-height:calc(100dvh - 20px);overflow:auto}
.sprechblase{background:#fff;border:2.5px solid var(--tinte);border-radius:14px;padding:6px 10px;font:700 13px var(--fliess);position:relative}
.warte{margin:0;font-weight:700;background:#fff;border:2px dashed var(--tinte);border-radius:12px;padding:8px 10px}
.qr{width:112px;height:112px;background:#fff;border:2.5px solid var(--tinte);border-radius:10px;padding:4px;flex:none}
.qr svg{width:100%;height:100%;display:block}
.spielerliste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.spielerliste li{background:#fff;border:2px solid var(--tinte);border-radius:10px;padding:4px 10px;font-weight:700;display:flex;gap:8px;align-items:center}
.spielerliste li.weg{opacity:.5}
.spielerliste small{color:var(--leise);font-weight:600}
.wahlblock{display:flex;flex-direction:column;gap:4px}
.namenszeile{flex-wrap:nowrap}.namenszeile input{flex:1;padding:5px 10px}
.helden{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.held{appearance:none;border:2.5px solid var(--tinte);background:#fff;border-radius:12px;padding:2px 2px 3px;display:flex;flex-direction:column;align-items:center;font:700 10.5px var(--fliess);letter-spacing:-.2px;color:var(--tinte);cursor:pointer;min-width:0}
.held svg{width:34px;height:28px;display:block}
.held span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.held.an{background:#F2C14E;box-shadow:0 3px 0 var(--tinte)}
.heldinfo{margin:0;font-size:12.5px;color:var(--leise)} .heldinfo b{color:var(--tinte)}
.wappen svg{width:22px;height:19px;display:inline-block;vertical-align:middle}
.netzstatus{position:fixed;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#16161D;color:#fff;border-radius:999px;padding:4px 14px;font:700 12px var(--fliess);z-index:8;white-space:nowrap}
.hochkant{position:fixed;inset:0;background:var(--creme);display:none;place-items:center;text-align:center;padding:30px;z-index:9}
.hochkant div{font:800 20px var(--display)}
@media (orientation:portrait) and (pointer:coarse){.hochkant{display:grid}}
</style>
</head>
<body>
<div class="hud" id="hud" hidden>
  <div class="platz" id="platz">1<small>. Platz</small></div>
  <div class="runde" id="runde">Runde 1/3</div>
  <div class="uhr" id="uhr">0:00,0</div>
  <div class="sporen" id="sporen" hidden></div>
  <div class="fleder" id="fleder" hidden><span>🦇</span><span>🦇</span><span>🦇</span><span>🦇</span><span>🦇</span></div>
  <div class="extra leer" id="extra"></div>
  <div class="schuettel" id="schuettel" hidden>Schütteln!</div>
  <div class="vorschau" id="vorschau" hidden></div>
  <button class="pause" id="pause" aria-label="Pause">II</button>
  <svg class="mini" id="mini" viewBox="0 0 104 84"></svg>
  <div class="lenk" id="lenk"><svg width="26" height="26" viewBox="0 0 26 26" id="lenkrad"><circle cx="13" cy="13" r="10.5" fill="none" stroke="#fff" stroke-width="2.6"/><path d="M3 13h20M13 13v10" stroke="#fff" stroke-width="2.6"/></svg><span id="lenktext">Handy neigen zum Lenken</span></div>
  <div class="knopf k-drift" id="kdrift">DRIFT</div>
  <div class="knopf k-kraft" id="kkraft" aria-label="Heldenkraft"><span class="bild" id="kraftbild"></span></div>
  <div class="gold" id="gold"><i></i>0</div>
  <div class="knopf k-extra" id="kextra">EXTRA</div>
  <div class="knopf k-links" id="klinks" hidden>◀</div>
  <div class="knopf k-rechts" id="krechts" hidden>▶</div>
  <div class="gross" id="gross" hidden></div>
  <div class="meldung" id="meldung" hidden></div>
  <div class="zuschau" id="zuschau" hidden><span>👀 <span id="zuschauName"></span></span><button id="zuschauWeiter">Nächster ▶</button><button id="zuschauErgebnis">Ergebnis</button></div>
</div>

<div class="schicht" id="menue"><div class="kasten breit" id="menueKasten"></div></div>

<div class="schicht" id="ziel" hidden><div class="kasten" id="zielKasten"></div></div>

<div class="schicht" id="pausiert" hidden>
  <div class="kasten" style="width:auto;align-items:center">
    <h1>Menü</h1>
    <div class="zeile"><button class="los zweit" id="abbruch">Aufgeben</button><button class="los" id="weiter">Weiter</button></div>
  </div>
</div>

<div class="netzstatus" id="netzstatus" hidden></div>

<div class="hochkant"><div>📱↻<br>Bitte das Handy quer halten</div></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="../netz.js?v=2026-11-20a"></script>
<script src="../abend.js?v=2026-11-20b" data-spiel="kart"></script>
<script src="../verlies/bilder.js?v=2026-11-20b"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module" src="spiel.js?v=2026-11-20l"></script>
</body>
</html>
